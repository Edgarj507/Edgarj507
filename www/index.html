<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>KAIJU BLOCKS</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --board-bg: #0d1117;
            --text-color: #c9d1d9;
            --button-bg: #21262d;
            --button-border: #444c56;
            --accent-color: #58a6ff;
        }
        html, body {
            /* native shell has no browser chrome to eat the notch/home-indicator area */
            height: 100%;
            overscroll-behavior: none;
        }
        body {
            font-family: 'Press Start 2P', cursive;
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none; /* pinch-zoom/double-tap-zoom are useless in-game, and fight the drop/rotate gestures */
            transition: background 1.5s ease-in-out;
            position: relative;
            overflow: hidden;
        }
        .game-wrapper {
            position: relative;
            transform: translateX(8%);
        }
        .game-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            padding-top: 80px;
        }
        .main-game-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        canvas#tetris {
            background-color: rgba(10, 12, 24, 0.82);
            border: 4px solid transparent;
            border-image: linear-gradient(140deg, #0DC2FF, #F538FF 55%, #0DFF72) 1;
            width: 100%;
            max-width: 360px;
            aspect-ratio: 1 / 2;
            box-shadow:
                0 0 22px rgba(245, 56, 255, 0.35),
                0 0 44px rgba(13, 194, 255, 0.18),
                inset 0 0 30px rgba(13, 194, 255, 0.10);
        }
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 180px;
        }
        .info-box, .preview-box {
            background: linear-gradient(160deg, rgba(46, 33, 88, 0.55), rgba(15, 12, 30, 0.65));
            border: 1px solid rgba(120, 140, 255, 0.35);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4), inset 0 0 16px rgba(120, 140, 255, 0.08);
        }
        .info-box h2 {
            font-size: 0.8em;
            margin: 0 0 10px 0;
            color: var(--accent-color);
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(88, 166, 255, 0.7);
        }
        .info-box p {
            font-size: 1.15em;
            margin: 0;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: auto auto auto;
            gap: 10px;
            width: 100%;
            max-width: 360px;
        }
        .control-btn {
            background: linear-gradient(180deg, #2b3350, #171b2e);
            border: 1px solid rgba(120, 140, 255, 0.4);
            color: #dfe6ff;
            padding: 15px 0;
            font-family: inherit;
            font-size: 1.2rem;
            border-radius: 10px;
            cursor: pointer;
            transition: border-color 0.15s, box-shadow 0.15s, transform 0.08s;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 3px 0 rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }
        .control-btn:hover {
            border-color: #58a6ff;
            box-shadow: 0 0 14px rgba(88, 166, 255, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }
        .control-btn:active { transform: translateY(2px); box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.5); }
        .control-btn.up { grid-column: 2; grid-row: 1; }
        .control-btn.left { grid-column: 1; grid-row: 2; }
        .control-btn.down { grid-column: 2; grid-row: 2; }
        .control-btn.right { grid-column: 3; grid-row: 2; }
        .control-btn.drop {
            grid-column: 1 / 4; grid-row: 3;
            background: linear-gradient(180deg, #2f9a6a, #12503a);
            border-color: rgba(80, 255, 180, 0.5);
            letter-spacing: 2px;
        }
        .control-btn.pause {
            grid-column: 1 / 4; grid-row: 4;
            background: linear-gradient(180deg, #c0455f, #7a1f33);
            border-color: rgba(255, 120, 150, 0.5);
            letter-spacing: 2px;
        }
        .modal, .pause-overlay {
            display: none; position: absolute; z-index: 10;
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.7);
            flex-direction: column;
            justify-content: center; align-items: center;
            color: white; font-size: 2em;
        }
        .pause-overlay-content { text-align: center; }
        .resume-button {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.7em;
            padding: 15px 30px;
            margin-top: 20px;
            cursor: pointer;
            color: white;
            background-color: #238636;
            border: none;
            border-radius: 5px;
            text-transform: uppercase;
        }
        .modal-content {
            background-color: var(--button-bg); padding: 30px;
            border: 2px solid var(--button-border); border-radius: 10px;
            text-align: center; max-width: 80%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .modal-content h2 { margin-top: 0; color: #f78166; }
        .modal-content button {
            background-color: #238636; color: white; padding: 10px 20px; border: none;
            border-radius: 5px; font-family: inherit; font-size: 1em; cursor: pointer;
        }
        /* Real skyline art (see PHOTO_CITIES), crossfaded between cities in cycleCity(). */
        #cityscapePhoto {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
        }
        .city-name {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 5;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.7em;
            color: #ffffff;
            text-shadow: 2px 2px #d81e8f;
            letter-spacing: 1px;
            transition: opacity 0.6s ease-in-out;
        }
        .audio-toggle {
            position: fixed;
            left: 14px;
            z-index: 6;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.55em;
            background-color: var(--button-bg);
            color: var(--text-color);
            border: 2px solid var(--button-border);
            border-radius: 6px;
            padding: 8px 10px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        .audio-toggle:active { transform: scale(0.95); }
        .audio-toggle.on { color: #0DFF72; border-color: #0DFF72; }
        #musicToggle { top: 14px; }
        #fxToggle { top: 54px; }
        #crt {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 7;
            background: repeating-linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0.10),
                rgba(0, 0, 0, 0.10) 1px,
                transparent 1px,
                transparent 3px
            );
        }
        #crt::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 56%, rgba(0, 0, 0, 0.5) 100%);
        }
        .flying-saucer {
            position: fixed;
            z-index: 1;
            /* Scales with viewport instead of a flat 80x40 - matches the real
               saucer.png's ~1.21:1 aspect (250x207) so object-fit:contain on its
               <img> never needs to compensate for a mismatched box. */
            width: 20vw;
            height: 16.5vw;
            min-width: 140px;
            min-height: 116px;
            max-width: 220px;
            max-height: 182px;
            filter: drop-shadow(0 0 8px #F538FF);
        }
        .ufo-light { animation: blink 0.5s infinite alternate; }
        .ufo-light.b { animation-delay: 0.25s; }
        .kaiju {
            position: fixed;
            z-index: 2;
            width: 170px;
            height: 210px;
            filter: drop-shadow(0 0 10px #0DFF72) drop-shadow(0 0 6px #FF6B1A);
            pointer-events: none;
        }
        .kaiju.roaring { animation: kaiju-shake 0.1s infinite; }
        .kaiju.charging .plate { animation: plate-glow 0.25s infinite alternate; }
        @keyframes plate-glow {
            from { fill: #CFEFFF; }
            to { fill: #FFFFFF; }
        }
        /* Image sprites have no .plate rects to target, so "charging" reads as a
           brightness pulse on the whole sprite instead - same tell, different sprite type. */
        .kaiju.charging img { animation: img-charge-glow 0.25s infinite alternate; }
        @keyframes img-charge-glow {
            from { filter: brightness(1) saturate(1); }
            to { filter: brightness(1.6) saturate(1.4); }
        }
        @keyframes kaiju-shake {
            0%   { transform: translate(0, 0); }
            25%  { transform: translate(-2px, 1px); }
            50%  { transform: translate(2px, -1px); }
            75%  { transform: translate(-1px, -1px); }
            100% { transform: translate(1px, 1px); }
        }
        .atomic-breath {
            position: fixed;
            height: 7px;
            background: linear-gradient(90deg, #0DFF72, #E6FFF0, #0DC2FF);
            filter: drop-shadow(0 0 8px #0DFF72) drop-shadow(0 0 4px #0DC2FF);
            transform-origin: left center;
            z-index: 3;
            border-radius: 999px; /* always a full pill regardless of the JS-set thickness */
        }
        .laser-beam {
            position: fixed;
            height: 3px;
            background: linear-gradient(90deg, #ff0000, #ff9999);
            filter: drop-shadow(0 0 5px #ff0000);
            transform-origin: left center;
            z-index: 2;
        }
        .credit {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.8em;
            color: #888;
            z-index: 5;
            transition: opacity 0.5s, transform 1.5s ease-in;
        }
        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0.2; }
        }
        @media (max-width: 800px) {
            .game-wrapper {
                transform: none;
            }
            .game-container {
                flex-direction: column;
                align-items: center;
            }
            .sidebar {
                flex-direction: row;
                width: 100%;
                max-width: 360px;
            }
            .info-box, .preview-box {
                flex-grow: 1;
                min-width: 120px;
            }
            .credit {
                font-size: 0.6em;
            }
        }
    </style>
</head>
<body>
    <div id="cityscapePhoto"></div>
    <button id="musicToggle" class="audio-toggle">&#9834; MUSIC: OFF</button>
    <button id="fxToggle" class="audio-toggle on">&#128266; FX: ON</button>
    <div id="cityName" class="city-name"></div>
    <div class="credit">CREATED BY EDGAR R.</div>
    <div class="game-wrapper">
        <div class="game-container">
            <div class="main-game-column">
                <canvas id="tetris"></canvas>
                <div class="controls">
                    <button class="control-btn left">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    </button>
                    <button class="control-btn up">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
                    </button>
                    <button class="control-btn right">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                    </button>
                    <button class="control-btn down">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>
                    </button>
                    <button class="control-btn drop">DROP</button>
                    <button id="pauseButton" class="control-btn pause">PAUSE</button>
                </div>
            </div>
             <div class="sidebar">
                <div class="info-box"><h2>SCORE</h2><p id="score">0</p></div>
                <div class="info-box"><h2>LINES</h2><p id="lines">0</p></div>
                <div class="info-box"><h2>LEVEL</h2><p id="level">1</p></div>
                <div class="info-box"><h2>LIVES</h2><p id="livesDisplay">4</p></div>
                <div class="preview-box"><h2>NEXT</h2><canvas id="preview" width="120" height="120"></canvas></div>
            </div>
        </div>
        <div id="pauseOverlay" class="pause-overlay">
            <div class="pause-overlay-content">
                <p>PAUSED</p>
                <button id="resumeButton" class="resume-button">Resume</button>
            </div>
        </div>
    </div>

    <div id="crt"></div>

    <div id="gameOverModal" class="modal" style="position:fixed">
        <div class="modal-content">
            <h2>GAME OVER</h2>
            <p>Your score: <span id="finalScore">0</span></p>
            <p id="continueError" style="display:none; color:#f78166; font-size:0.7em;"></p>
            <button id="continueButton">Continue</button>
            <button id="restartButton">Play Again</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        const previewCanvas = document.getElementById('preview');
        const previewContext = previewCanvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const linesEl = document.getElementById('lines');
        const levelEl = document.getElementById('level');
        const livesEl = document.getElementById('livesDisplay');
        const pauseButton = document.getElementById('pauseButton');
        const pauseOverlay = document.getElementById('pauseOverlay');
        const resumeButton = document.getElementById('resumeButton');
        const gameOverModal = document.getElementById('gameOverModal');
        const finalScoreEl = document.getElementById('finalScore');
        const restartButton = document.getElementById('restartButton');
        const continueButton = document.getElementById('continueButton');
        const continueErrorEl = document.getElementById('continueError');
        const creditElement = document.querySelector('.credit');
        const cityscapePhoto = document.getElementById('cityscapePhoto');
        const cityNameEl = document.getElementById('cityName');
        const musicToggle = document.getElementById('musicToggle');
        const fxToggle = document.getElementById('fxToggle');

        const COLS = 12;
        const ROWS = 24;
        let BLOCK_SIZE;
        const PREVIEW_BLOCK_SIZE = 30;

        // --- Game State ---
        let board, score, lines, level, dropCounter, dropInterval, lastTime;
        let isGameOver = false;
        let isPaused = false;
        const STARTING_LIVES = 4;
        const CONTINUE_PRICE_FALLBACK = '$0.25'; // shown only if the native price lookup fails
        let lives = STARTING_LIVES;
        let continuePurchaseInFlight = false;
        let animationFrameId;
        let particles = [];

        let COLORS = [null, '#F538FF', '#0DC2FF', '#0DFF72', '#FF0D72', '#FF8E0D', '#FFE138', '#3877FF'];
        function shade(hex, pct) {
            const n = parseInt(hex.slice(1), 16);
            let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
            const f = pct / 100;
            if (pct >= 0) { r += (255 - r) * f; g += (255 - g) * f; b += (255 - b) * f; }
            else { r *= 1 + f; g *= 1 + f; b *= 1 + f; }
            return `rgb(${r | 0},${g | 0},${b | 0})`;
        }
        const BLOCK_LIGHT = COLORS.map(c => c ? shade(c, 50) : null);
        const BLOCK_DARK  = COLORS.map(c => c ? shade(c, -42) : null);
        const BLOCK_EDGE  = COLORS.map(c => c ? shade(c, -64) : null);
        const TETROMINOES = {
            'T': [[0, 1, 0], [1, 1, 1], [0, 0, 0]],
            'I': [[0, 0, 0, 0], [2, 2, 2, 2], [0, 0, 0, 0], [0, 0, 0, 0]],
            'S': [[0, 3, 3], [3, 3, 0], [0, 0, 0]],
            'Z': [[4, 4, 0], [0, 4, 4], [0, 0, 0]],
            'L': [[0, 0, 5], [5, 5, 5], [0, 0, 0]],
            'J': [[6, 0, 0], [6, 6, 6], [0, 0, 0]],
            'O': [[0, 7, 7, 0], [0, 7, 7, 0], [0, 0, 0, 0], [0, 0, 0, 0]]
        };
        const PIECES = 'TSZLIJO';
        let player = { pos: { x: 0, y: 0 }, matrix: null, next: null };


        const DYNAMIC_BACKGROUNDS = [
            'linear-gradient(160deg, #020024 0%, #090979 35%, #002147 100%)', 'linear-gradient(160deg, #370a3b 0%, #4a0d4e 35%, #870058 100%)',
            'linear-gradient(160deg, #120321 0%, #57075b 35%, #8f0f9b 100%)', 'linear-gradient(160deg, #410d0d 0%, #871414 35%, #b91c1c 100%)',
            'linear-gradient(160deg, #011627 0%, #012a4a 35%, #013f6d 100%)'
        ];
        let currentBackgroundIndex = 0;
        const BACKGROUND_TIMER_DURATION = 35;
        let backgroundChangeTimer = BACKGROUND_TIMER_DURATION;
        function updateDynamicBackground() {
            currentBackgroundIndex = (currentBackgroundIndex + 1) % DYNAMIC_BACKGROUNDS.length;
            document.body.style.background = DYNAMIC_BACKGROUNDS[currentBackgroundIndex];
        }

        const createBoard = () => Array.from({ length: ROWS }, () => Array(COLS).fill(0));
        const createPiece = type => JSON.parse(JSON.stringify(TETROMINOES[type]));

        // ====================================================================
        //  CITYSCAPE BACKGROUND - real skyline art, cycled with a crossfade
        // ====================================================================
        const PHOTO_CITIES = {
            la: { name: 'LOS ANGELES', image: 'assets/cities/la.jpg' },
            tokyo: { name: 'TOKYO', image: 'assets/cities/tokyo.jpg' },
            newyork: { name: 'NEW YORK', image: 'assets/cities/newyork.jpg' },
            cairo: { name: 'CAIRO', image: 'assets/cities/cairo.jpg' },
            london: { name: 'LONDON', image: 'assets/cities/london.jpg' }
        };
        const CITY_PLAYLIST = ['la', 'tokyo', 'newyork', 'cairo', 'london'];
        let cityIndex = 0;
        let currentCity = null;

        function buildCityAt(i) {
            return PHOTO_CITIES[CITY_PLAYLIST[i % CITY_PLAYLIST.length]];
        }
        function drawCurrentCity() {
            if (!currentCity) return;
            cityscapePhoto.style.backgroundImage = `url(${currentCity.image})`;
            if (cityNameEl) cityNameEl.textContent = currentCity.name;
        }
        function cycleCity() {
            cityscapePhoto.style.opacity = '0';
            if (cityNameEl) cityNameEl.style.opacity = '0';
            setTimeout(() => {
                cityIndex++;
                currentCity = buildCityAt(cityIndex);
                drawCurrentCity();
                cityscapePhoto.style.opacity = '1';
                if (cityNameEl) cityNameEl.style.opacity = '1';
            }, 600);
        }
        function initCityscape() {
            currentCity = buildCityAt(cityIndex);
            drawCurrentCity();
            cityscapePhoto.style.opacity = '1';
        }
        // ==================== end cityscape ================================

        function playerReset() {
            const pieceType = PIECES[Math.floor(Math.random() * PIECES.length)];
            player.matrix = player.next || createPiece(pieceType);
            const nextPieceType = PIECES[Math.floor(Math.random() * PIECES.length)];
            player.next = createPiece(nextPieceType);
            player.pos.y = 0;
            player.pos.x = Math.floor(COLS / 2) - Math.floor(player.matrix[0].length / 2);
            if (collide(board, player)) handleGameOver();
            drawPreview();
        }

        function shade(hex, pct) {
            const n = parseInt(hex.slice(1), 16);
            let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
            if (pct >= 0) { r += (255 - r) * pct; g += (255 - g) * pct; b += (255 - b) * pct; }
            else { r += r * pct; g += g * pct; b += b * pct; }
            return `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;
        }

        // A beveled, glossy 3D block drawn in scaled (1 unit = 1 cell) space
        function drawBlock(ctx, x, y, color) {
            const b = 0.14;
            ctx.fillStyle = shade(color, -0.35);
            ctx.fillRect(x, y, 1, 1);
            ctx.fillStyle = shade(color, 0.5);            // top-left highlight
            ctx.beginPath();
            ctx.moveTo(x, y); ctx.lineTo(x + 1, y); ctx.lineTo(x + 1 - b, y + b);
            ctx.lineTo(x + b, y + b); ctx.lineTo(x + b, y + 1 - b); ctx.lineTo(x, y + 1);
            ctx.closePath(); ctx.fill();
            ctx.fillStyle = shade(color, -0.5);           // bottom-right shadow
            ctx.beginPath();
            ctx.moveTo(x + 1, y); ctx.lineTo(x + 1, y + 1); ctx.lineTo(x, y + 1);
            ctx.lineTo(x + b, y + 1 - b); ctx.lineTo(x + 1 - b, y + 1 - b); ctx.lineTo(x + 1 - b, y + b);
            ctx.closePath(); ctx.fill();
            ctx.fillStyle = color;                        // inner face
            ctx.fillRect(x + b, y + b, 1 - 2 * b, 1 - 2 * b);
            ctx.fillStyle = 'rgba(255,255,255,0.28)';     // glossy top strip
            ctx.fillRect(x + b, y + b, 1 - 2 * b, (1 - 2 * b) * 0.30);
        }

        function drawGrid() {
            context.strokeStyle = 'rgba(120,160,255,0.06)';
            context.lineWidth = 0.02;
            for (let x = 1; x < COLS; x++) { context.beginPath(); context.moveTo(x, 0); context.lineTo(x, ROWS); context.stroke(); }
            for (let y = 1; y < ROWS; y++) { context.beginPath(); context.moveTo(0, y); context.lineTo(COLS, y); context.stroke(); }
        }

        function drawPlayerGlow() {
            const v = player.matrix.flat().find(val => val > 0);
            if (!v) return;
            context.save();
            context.shadowColor = COLORS[v];
            context.shadowBlur = 0.45;
            context.globalCompositeOperation = 'lighter';
            context.globalAlpha = 0.5;
            context.fillStyle = COLORS[v];
            player.matrix.forEach((row, y) => row.forEach((val, x) => {
                if (val !== 0) context.fillRect(x + player.pos.x + 0.2, y + player.pos.y + 0.2, 0.6, 0.6);
            }));
            context.restore();
        }

        function draw() {
            context.clearRect(0, 0, canvas.width, canvas.height);
            drawGrid();
            drawGhostPiece();
            drawMatrix(board, { x: 0, y: 0 });
            drawPlayerGlow();
            drawMatrix(player.matrix, player.pos);
            drawParticles();
        }

        function drawMatrix(matrix, offset) {
            const currentContext = this?.context || context;
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) drawBlock(currentContext, x + offset.x, y + offset.y, COLORS[value]);
                });
            });
        }

        function drawGhostPiece() {
            const ghost = { ...player, pos: { ...player.pos } };
            while (!collide(board, ghost)) { ghost.pos.y++; }
            ghost.pos.y--;
            const v = player.matrix.flat().find(val => val > 0);
            if (v) {
                const color = COLORS[v];
                ghost.matrix.forEach((row, y) => row.forEach((value, x) => {
                    if (value !== 0) {
                        context.globalAlpha = 0.16;
                        context.fillStyle = color;
                        context.fillRect(x + ghost.pos.x, y + ghost.pos.y, 1, 1);
                        context.globalAlpha = 0.5;
                        context.strokeStyle = color;
                        context.lineWidth = 0.05;
                        context.strokeRect(x + ghost.pos.x + 0.03, y + ghost.pos.y + 0.03, 0.94, 0.94);
                    }
                }));
                context.globalAlpha = 1;
            }
        }

        function drawPreview() {
            previewContext.fillStyle = 'rgba(13, 17, 23, 0.8)';
            previewContext.fillRect(0, 0, previewCanvas.width, previewCanvas.height);
            const matrix = player.next;
            if (!matrix) return;
            let minX = matrix[0].length, maxX = -1, minY = matrix.length, maxY = -1;
            for (let y = 0; y < matrix.length; y++) {
                for (let x = 0; x < matrix[y].length; x++) {
                    if (matrix[y][x] !== 0) {
                        minX = Math.min(minX, x);
                        maxX = Math.max(maxX, x);
                        minY = Math.min(minY, y);
                        maxY = Math.max(maxY, y);
                    }
                }
            }
            const shapeWidth = maxX - minX + 1;
            const shapeHeight = maxY - minY + 1;
            const canvasBlocksW = previewCanvas.width / PREVIEW_BLOCK_SIZE;
            const canvasBlocksH = previewCanvas.height / PREVIEW_BLOCK_SIZE;
            const offsetX = (canvasBlocksW - shapeWidth) / 2 - minX;
            const offsetY = (canvasBlocksH - shapeHeight) / 2 - minY;
            const tempContext = { context: previewContext };
            drawMatrix.call(tempContext, matrix, {x: offsetX, y: offsetY});
        }

        function merge(board, player) {
            player.matrix.forEach((row, y) => row.forEach((value, x) => {
                if (value !== 0) board[y + player.pos.y][x + player.pos.x] = value;
            }));
        }

        function collide(board, player) {
            const [matrix, offset] = [player.matrix, player.pos];
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < matrix[y].length; ++x) {
                    if (matrix[y][x] !== 0 && (board[y + offset.y] && board[y + offset.y][x + offset.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        // Cache of preloaded Image objects for themed particle art, keyed by src.
        // Reused across every explosion rather than constructing a new Image per
        // particle - these are small stamps drawn many times per frame.
        const particleImageCache = {};
        function getParticleImage(src) {
            if (!particleImageCache[src]) {
                const img = new Image();
                img.src = src;
                particleImageCache[src] = img;
            }
            return particleImageCache[src];
        }

        function createExplosion(x, y, color, images) {
            for (let i = 0; i < 15; i++) {
                // Mix themed sprites with plain squares rather than replacing them
                // outright - keeps some visual variety, and degrades gracefully to
                // all-squares if `images` is empty/undefined (e.g. UFO laser hits).
                const useThemed = images && images.length && Math.random() < 0.6;
                particles.push({
                    x: x + 0.5, y: y + 0.5,
                    vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.4,
                    size: Math.random() * 0.45 + 0.15, color: color, life: 80,
                    img: useThemed ? getParticleImage(images[Math.floor(Math.random() * images.length)]) : null
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy; p.vy += 0.008; p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function drawParticles() {
            for (const p of particles) {
                context.globalAlpha = Math.max(0, p.life / 80);
                if (p.img && p.img.complete && p.img.naturalWidth) {
                    context.drawImage(p.img, p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
                } else {
                    // Also the fallback while a themed image is still loading, not just
                    // for the no-image case - avoids a blank gap on an explosion's first frame.
                    context.fillStyle = p.color;
                    context.fillRect(p.x, p.y, p.size, p.size);
                }
            }
            context.globalAlpha = 1.0;
        }

        function boardSweep() {
            let clearedLinesCount = 0;
            for (let y = board.length - 1; y >= 0; y--) {
                if (board[y].every(value => value > 0)) {
                    clearedLinesCount++;
                    const clearedRow = board.splice(y, 1)[0];
                    clearedRow.forEach((value, x) => createExplosion(x, y, COLORS[value]));
                    board.unshift(Array(COLS).fill(0));
                    y++;
                }
            }
            if (clearedLinesCount > 0) {
                lines += clearedLinesCount;
                sfxLine(clearedLinesCount);
                hapticImpact('HEAVY');
                const lineScores = [0, 40, 100, 300, 1200];
                score += (lineScores[clearedLinesCount] || lineScores[4]) * level;
                const newLevel = Math.floor(lines / 10) + 1;
                if (newLevel > level) {
                    level = Math.min(100, newLevel);
                    sfxLevel();
                    const startSpeed = 1000, endSpeed = 50;
                    const progress = (level - 1) / 99;
                    dropInterval = startSpeed - (startSpeed - endSpeed) * progress;
                    dropInterval = Math.max(endSpeed, dropInterval);
                }
            }
        }

        function updateScore() {
            scoreEl.innerText = score; linesEl.innerText = lines; levelEl.innerText = level;
            livesEl.innerText = lives;
        }

        function rotate(matrix) {
            const N = matrix.length - 1;
            return matrix.map((row, i) => row.map((val, j) => matrix[N - j][i]));
        }

        function playerRotate() {
            const originalMatrix = player.matrix, originalPos = player.pos.x;
            player.matrix = rotate(player.matrix);
            let offset = 1;
            while (collide(board, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (Math.abs(offset) > player.matrix[0].length) {
                    player.matrix = originalMatrix;
                    player.pos.x = originalPos;
                    return;
                }
            }
            sfxRotate();
        }

        const playerMove = dir => { player.pos.x += dir; if (collide(board, player)) { player.pos.x -= dir; } else { sfxMove(); } };
        function playerDrop() {
            player.pos.y++;
            if (collide(board, player)) {
                player.pos.y--;
                merge(board, player);
                sfxLock();
                hapticImpact('LIGHT');
                boardSweep(); updateScore(); playerReset();
            }
            dropCounter = 0;
        }
        function playerHardDrop() {
            sfxDrop();
            while (!collide(board, player)) { player.pos.y++; }
            player.pos.y--;
            merge(board, player);
            sfxLock();
            hapticImpact('LIGHT');
            boardSweep(); updateScore(); playerReset();
            dropCounter = 0;
        }

        function update(time = 0) {
            if (isPaused) return;
            if (isGameOver) {
                updateParticles();
                context.clearRect(0, 0, canvas.width, canvas.height);
                drawParticles();
                if (particles.length === 0) {
                    document.querySelector('.game-container').style.visibility = 'hidden';
                    document.querySelector('.controls').style.visibility = 'hidden';
                    gameOverModal.style.display = 'flex';
                    prepareContinueButton();
                } else {
                    animationFrameId = requestAnimationFrame(update);
                }
                return;
            }
            updateParticles();
            const deltaTime = time - lastTime;
            lastTime = time;
            dropCounter += deltaTime;
            if (dropCounter > dropInterval) playerDrop();
            draw();
            animationFrameId = requestAnimationFrame(update);
        }

        function togglePause() {
            if (isGameOver) return;
            isPaused = !isPaused;
            if (isPaused) {
                cancelAnimationFrame(animationFrameId);
                pauseOverlay.style.display = 'flex';
                pauseButton.textContent = 'RESUME';
            } else {
                lastTime = performance.now();
                update();
                pauseOverlay.style.display = 'none';
                pauseButton.textContent = 'PAUSE';
            }
        }

        function handleVisibilityChange() {
            if (document.hidden && !isPaused && !isGameOver) togglePause();
        }

        function handleGameOver() {
            isGameOver = true;
            sfxGameOver();
            finalScoreEl.textContent = score;
            board.forEach((row, y) => row.forEach((value, x) => {
                if (value > 0) createExplosion(x, y, COLORS[value]);
            }));
            // GameKit dedupes against your best submitted score, so it's safe
            // to submit here even though a continue might raise this later.
            gameCenterSubmitScore(score);
        }

        // Sets the modal's continue button to either "free life" or "paid" mode
        // and wires its handler. Called each time the game-over modal is shown.
        function prepareContinueButton() {
            continueErrorEl.style.display = 'none';
            continueButton.disabled = false;
            if (lives > 0) {
                // Free continues still available - restarting would just throw away
                // a life you haven't used, so Play Again stays hidden until lives run out.
                restartButton.style.display = 'none';
                continueButton.textContent = `CONTINUE (${lives} LEFT)`;
                continueButton.onclick = () => continueAfterGameOver(false);
                return;
            }
            // Lives are gone: show Play Again alongside the paid continue so there's
            // always a free way forward, not just a paywall.
            restartButton.style.display = '';
            continueButton.textContent = `CONTINUE — ${CONTINUE_PRICE_FALLBACK}`;
            continueButton.onclick = () => continueAfterGameOver(true);
            const iap = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.ContinuePurchase;
            if (iap) {
                // Replace the fallback label with StoreKit's real localized price once it loads.
                iap.getPrice().then(result => {
                    if (result && result.priceString) continueButton.textContent = `CONTINUE — ${result.priceString}`;
                }).catch(() => {});
            }
        }

        async function continueAfterGameOver(requiresPayment) {
            if (continuePurchaseInFlight) return;
            continueErrorEl.style.display = 'none';

            if (!requiresPayment) {
                lives--;
                resumeAfterContinue();
                return;
            }

            const iap = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.ContinuePurchase;
            if (!iap) {
                // Plain-browser / non-Capacitor context: no real StoreKit to charge through.
                continueErrorEl.textContent = 'Purchases are only available in the App Store version.';
                continueErrorEl.style.display = 'block';
                return;
            }

            continuePurchaseInFlight = true;
            continueButton.disabled = true;
            continueButton.textContent = 'PROCESSING…';
            try {
                const result = await iap.purchase();
                if (result && result.success) {
                    resumeAfterContinue();
                } else {
                    continueErrorEl.textContent = result && result.error === 'cancelled'
                        ? 'Purchase cancelled.' : 'Purchase failed. Try again.';
                    continueErrorEl.style.display = 'block';
                    prepareContinueButton();
                }
            } catch (err) {
                continueErrorEl.textContent = 'Purchase failed. Try again.';
                continueErrorEl.style.display = 'block';
                prepareContinueButton();
            } finally {
                continuePurchaseInFlight = false;
            }
        }

        // Board can't stay topped-out or the next piece re-collides instantly, so a
        // continue (free or paid) wipes the board but keeps score/lines/level intact.
        function clearBoardKeepProgress() {
            board = createBoard();
            particles = [];
            dropCounter = 0;
            playerReset();
        }

        function resumeAfterContinue() {
            clearBoardKeepProgress();
            gameOverModal.style.display = 'none';
            document.querySelector('.game-container').style.visibility = 'visible';
            document.querySelector('.controls').style.visibility = 'visible';
            isGameOver = false;
            updateScore();
            lastTime = performance.now();
            update();
        }

        function resizeGame() {
            const canvasWidth = canvas.clientWidth;
            BLOCK_SIZE = canvasWidth / COLS;
            canvas.width = canvasWidth;
            canvas.height = BLOCK_SIZE * ROWS;
            context.scale(BLOCK_SIZE, BLOCK_SIZE);
            previewContext.scale(PREVIEW_BLOCK_SIZE, PREVIEW_BLOCK_SIZE);
        }

        function resetGame() {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            document.querySelector('.game-container').style.visibility = 'visible';
            document.querySelector('.controls').style.visibility = 'visible';
            isGameOver = false; isPaused = false;
            board = createBoard();
            score = 0; lines = 0; level = 1; lives = STARTING_LIVES;
            dropInterval = 1000;
            lastTime = 0; dropCounter = 0;
            particles = [];
            playerReset();
            updateScore();
            gameOverModal.style.display = 'none';
            pauseOverlay.style.display = 'none';
            pauseButton.textContent = 'PAUSE';
            update();
        }


        function destroyBlock(x, y, particleImages) {
            if (board[y] && board[y][x] > 0) {
                const color = COLORS[board[y][x]];
                createExplosion(x, y, color, particleImages);
                sfxZap();
                board[y][x] = 0;
            }
        }

        function createLaserBeam(startX, startY, endX, endY, onComplete) {
            sfxLaserFire();
            const laser = document.createElement('div');
            laser.classList.add('laser-beam');
            const length = Math.hypot(endX - startX, endY - startY);
            const angle = Math.atan2(endY - startY, endX - startX) * (180 / Math.PI);
            laser.style.width = `${length}px`;
            laser.style.left = `${startX}px`;
            laser.style.top = `${startY}px`;
            laser.style.transform = `rotate(${angle}deg)`;
            document.body.appendChild(laser);
            laser.animate([
                { opacity: 0 }, { opacity: 1, offset: 0.1 },
                { opacity: 1, offset: 0.9 }, { opacity: 0 }
            ], { duration: 300, easing: 'linear' })
            .onfinish = () => {
                laser.remove();
                if (onComplete) onComplete();
            };
        }

        // --- Pixel sprites ---------------------------------------------------
        // Each map is just rows of characters; every character maps to a color
        // in its palette (a '.' means an empty pixel). Edit these to reskin!
        const UFO_MAP = [
            '......CCC......',
            '.....CWWWC.....',
            '..mmmmmmmmmmm..',
            'MMMMMMMMMMMMMMM',
            'DYDDGDDYDDGDDYD',
            '..DDDDDDDDDDD..',
            '.....G...G.....'
        ];
        const UFO_PALETTE = {
            'C': { color: '#0DC2FF' }, 'W': { color: '#A9ECFF' },
            'm': { color: '#FF7BF5' }, 'M': { color: '#F538FF' },
            'D': { color: '#8A1E93' },
            'Y': { color: '#FFE138', cls: 'ufo-light' },
            'G': { color: '#0DFF72', cls: 'ufo-light b' }
        };

        // The kaiju roster. origin = [fx,fy] fraction of the sprite where the
        // beam starts; entrance = which edge it comes in from.
        // All four now enter from the left/right screen edges only (no top/bottom),
        // small and mostly off-canvas so they don't cover the board - see createKaiju().
        //
        // `image` is the real sprite (transparent-background PNG) for this kaiju.
        // No procedural fallback anymore - if a file 404s, that spawn is just
        // skipped (see createKaijuElement/createKaiju) rather than showing a
        // different, unwanted design.
        //
        // `beamImage` replaces the plain CSS gradient bar in createAtomicBreath()
        // with real beam art, same asset for all four, recolored per kaiju via
        // `beamHue`, a CSS hue-rotate() degree value computed from the art's own
        // sampled base hue (~201deg, cyan-blue) rather than guessed:
        //   red    = (0   - 201) mod 360 -> +159deg
        //   green  = (120 - 201) mod 360 -> -81deg
        // ZORGOX/GYRO-MOTH keep the art's native blue (beamHue omitted/0).
        // `particleImages`, if set, mixes themed sprites into that kaiju's impact
        // explosions (see createExplosion) instead of plain colored squares.
        //
        // `facing` is which way the art itself looks: 'left', 'right', or
        // 'symmetric' (front-on, no strong bias - flipping it changes nothing).
        // createKaiju() compares this against what its `entrance` side requires
        // (entering from the left means the board is to its right, so it must
        // face right, and vice versa) and mirrors the sprite - and `origin`'s
        // x fraction along with it - whenever they don't already match, so
        // every kaiju looks at the board instead of away from it.
        const KAIJU_TYPES = [
            { name: 'ZORGOX', image: 'assets/kaiju/zorgox.png', beamImage: 'assets/kaiju/beam.png', entrance: 'left', facing: 'right', origin: [0.84, 0.19], glow: '#0DFF72', beam: ['#B06AFF', '#E8D9FF', '#0DC2FF'] },
            { name: 'GYRO-MOTH', image: 'assets/kaiju/gyro-moth.png', beamImage: 'assets/kaiju/beam.png', particleImages: ['assets/kaiju/gyro-moth-cloud.png', 'assets/kaiju/gyro-moth-particles.png'], entrance: 'left', facing: 'symmetric', origin: [0.5, 0.58], glow: '#5EA1FF', beam: ['#4FC3FF', '#DCF3FF', '#7A5CFF'] },
            { name: 'ROCK-TORT', image: 'assets/kaiju/rock-tort.png', beamImage: 'assets/kaiju/beam.png', beamHue: 159, entrance: 'right', facing: 'right', origin: [0.77, 0.38], glow: '#FF6B1A', beam: ['#FF3B1A', '#FFD24A', '#FF8A1A'] },
            { name: 'TENDRIL-KLACK', image: 'assets/kaiju/tendril-klack.png', beamImage: 'assets/kaiju/beam.png', beamHue: -81, entrance: 'right', facing: 'symmetric', origin: [0.5, 0.62], glow: '#2FFFE0', beam: ['#2FFFE0', '#E0FFFA', '#5EFFC7'] }
        ];

        function buildSprite(map, palette) {
            const w = Math.max(...map.map(r => r.length));
            const h = map.length;
            let rects = '';
            map.forEach((row, y) => {
                [...row].forEach((ch, x) => {
                    const p = palette[ch];
                    if (!p) return;
                    const cls = p.cls ? ` class="${p.cls}"` : '';
                    // width/height slightly over 1 to hide seams between pixels
                    rects += `<rect x="${x}" y="${y}" width="1.03" height="1.03" fill="${p.color}"${cls}/>`;
                });
            });
            return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block;">${rects}</svg>`;
        }

        const UFO_IMAGE = 'assets/ufo/saucer.png';
        function createSaucerElement() {
            const saucer = document.createElement('div');
            saucer.classList.add('flying-saucer');
            const img = document.createElement('img');
            img.alt = '';
            // object-fit:contain so the real image's aspect ratio (taller/rounder
            // than the flat procedural UFO_MAP box) never gets squashed into it.
            img.style.cssText = 'width:100%;height:100%;display:block;object-fit:contain;image-rendering:pixelated;';
            img.addEventListener('error', () => {
                img.remove();
                saucer.innerHTML = buildSprite(UFO_MAP, UFO_PALETTE);
            }, { once: true });
            img.src = UFO_IMAGE;
            saucer.appendChild(img);
            return saucer;
        }

        function fireLaser(saucer) {
            const targets = [];
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (board[y][x] > 0) targets.push({ x, y });
                }
            }
            if (targets.length === 0) return;
            const target = targets[Math.floor(Math.random() * targets.length)];
            const originRect = saucer.getBoundingClientRect();
            const canvasRect = canvas.getBoundingClientRect();
            // Underside of the saucer's dome, not its full bounding box center,
            // so the beam visibly starts at the hull instead of floating above it.
            const startX = originRect.left + originRect.width * 0.5;
            const startY = originRect.top + originRect.height * 0.88;
            const endX = canvasRect.left + (target.x * BLOCK_SIZE) + (BLOCK_SIZE / 2);
            const endY = canvasRect.top + (target.y * BLOCK_SIZE) + (BLOCK_SIZE / 2);
            createLaserBeam(startX, startY, endX, endY, () => destroyBlock(target.x, target.y));
        }

        function createFlyingSaucer() {
            const saucer = createSaucerElement();
            const viewportWidth = window.innerWidth, viewportHeight = window.innerHeight;
            const startSide = Math.random() < 0.5 ? 'left' : 'right';
            const startY = Math.random() * viewportHeight * 0.3 + viewportHeight * 0.1;
            let startX, endX;
            if (startSide === 'left') {
                startX = -100; endX = viewportWidth + 100;
            } else {
                startX = viewportWidth + 100; endX = -100;
            }
            saucer.style.left = `${startX}px`;
            saucer.style.top = `${startY}px`;
            document.body.appendChild(saucer);
            setTimeout(() => {
                if (document.body.contains(saucer)) fireLaser(saucer);
            }, Math.random() * 2000 + 1000);
            saucer.animate(
                [{ transform: 'translateX(0)' }, { transform: `translateX(${endX - startX}px)` }],
                { duration: Math.random() * 3000 + 4000, easing: 'linear' }
            ).onfinish = () => saucer.remove();
        }

        // --- KAIJU -----------------------------------------------------------
        function createKaijuElement(type) {
            const kaiju = document.createElement('div');
            kaiju.classList.add('kaiju');
            const img = document.createElement('img');
            img.alt = '';
            img.style.cssText = 'width:100%;height:100%;display:block;image-rendering:pixelated;';
            img.addEventListener('error', () => console.warn(`Kaiju art failed to load: ${type.image}`), { once: true });
            img.src = type.image;
            kaiju.appendChild(img);
            return kaiju;
        }

        // Kaiju beam art is preloaded once at game start (see preloadBeamImages)
        // rather than checked with an <img>.onerror per shot, since a beam only
        // lives ~550ms - there's no time for an async load to resolve mid-attack.
        // 'ok' -> use the art, 'failed'/unset -> fall back to the gradient bar.
        const beamImageStatus = {};
        function preloadBeamImages() {
            KAIJU_TYPES.forEach(type => {
                if (!type.beamImage || beamImageStatus[type.beamImage]) return;
                const img = new Image();
                img.onload = () => { beamImageStatus[type.beamImage] = 'ok'; };
                img.onerror = () => { beamImageStatus[type.beamImage] = 'failed'; };
                img.src = type.beamImage;
            });
        }

        function createAtomicBreath(startX, startY, endX, endY, colors, onComplete, beamImage, beamHue) {
            sfxBeamFire();
            const beam = document.createElement('div');
            beam.classList.add('atomic-breath');
            const length = Math.hypot(endX - startX, endY - startY);
            const angle = Math.atan2(endY - startY, endX - startX) * (180 / Math.PI);
            beam.style.width = `${length}px`;
            // Scales with the board's own block size instead of a flat px value,
            // so it reads as a similarly-thick bolt on a phone and on a wide screen.
            beam.style.height = `${Math.max(58, BLOCK_SIZE * 2.4)}px`;
            beam.style.left = `${startX}px`;
            beam.style.top = `${startY}px`;
            beam.style.transform = `rotate(${angle}deg)`;
            const dropShadow = `drop-shadow(0 0 10px ${colors[0]}) drop-shadow(0 0 5px ${colors[2]})`;
            if (beamImage && beamImageStatus[beamImage] === 'ok') {
                beam.style.background = 'none';
                beam.style.backgroundImage = `url(${beamImage})`;
                beam.style.backgroundSize = '100% 100%';
                beam.style.backgroundRepeat = 'no-repeat';
                // Recolors the shared blue beam art per kaiju - hue-rotate is a no-op
                // on the near-white/desaturated core of the bolt, so only its blue
                // tint shifts, the bright highlight stays clean either way.
                beam.style.filter = beamHue ? `hue-rotate(${beamHue}deg) ${dropShadow}` : dropShadow;
            } else {
                beam.style.background = `linear-gradient(90deg, ${colors[0]}, ${colors[1]}, ${colors[2]})`;
                beam.style.filter = dropShadow;
            }
            document.body.appendChild(beam);
            beam.animate([
                { opacity: 0, transform: `rotate(${angle}deg) scaleY(0.4)` },
                { opacity: 1, offset: 0.15, transform: `rotate(${angle}deg) scaleY(1.4)` },
                { opacity: 1, offset: 0.8, transform: `rotate(${angle}deg) scaleY(1)` },
                { opacity: 0, transform: `rotate(${angle}deg) scaleY(0.4)` }
            ], { duration: 550, easing: 'linear' })
            .onfinish = () => {
                beam.remove();
                if (onComplete) onComplete();
            };
        }

        function kaijuAttack(kaiju, type) {
            kaiju.classList.add('charging', 'roaring');
            sfxRoar();
            hapticNotification('WARNING');
            const kRect = kaiju.getBoundingClientRect();
            const mouthX = kRect.left + kRect.width * type.origin[0];
            const mouthY = kRect.top + kRect.height * type.origin[1];
            setTimeout(() => {
                kaiju.classList.remove('roaring');
                const targets = [];
                for (let y = 0; y < ROWS; y++) {
                    for (let x = 0; x < COLS; x++) {
                        if (board[y] && board[y][x] > 0) targets.push({ x, y });
                    }
                }
                if (targets.length > 0) {
                    // Difficulty scaling: original was always 1-2 blocks; now grows toward 1-6 by high levels.
                    const maxPerAttack = Math.min(6, 2 + Math.floor(level / 8));
                    const count = 1 + Math.floor(Math.random() * maxPerAttack);
                    const canvasRect = canvas.getBoundingClientRect();
                    for (let i = 0; i < count && targets.length > 0; i++) {
                        const idx = Math.floor(Math.random() * targets.length);
                        const t = targets.splice(idx, 1)[0];
                        setTimeout(() => {
                            const endX = canvasRect.left + (t.x * BLOCK_SIZE) + (BLOCK_SIZE / 2);
                            const endY = canvasRect.top + (t.y * BLOCK_SIZE) + (BLOCK_SIZE / 2);
                            createAtomicBreath(mouthX, mouthY, endX, endY, type.beam, () => destroyBlock(t.x, t.y, type.particleImages), type.beamImage, type.beamHue);
                        }, i * 350);
                    }
                }
                setTimeout(() => kaiju.classList.remove('charging'), 800);
            }, 900);
        }

        function createKaiju() {
            if (isPaused || isGameOver) return;
            const type = KAIJU_TYPES[Math.floor(Math.random() * KAIJU_TYPES.length)];
            const kaiju = createKaijuElement(type);

            // Sizing/positioning/animation needs the sprite's real pixel dimensions,
            // which for an <img> aren't known until the browser has loaded it - this
            // is deferred behind onload below rather than run synchronously.
            // Board is to the kaiju's right when it enters from the left, and vice
            // versa - flip the sprite (on the <img>, not the .kaiju div, since that
            // div's own transform is driven by the roaring/charging CSS animations
            // and a static flip there would fight them) whenever its native facing
            // doesn't already match, so it's never looking away from the board.
            const requiredFacing = type.entrance === 'left' ? 'right' : 'left';
            const needsFlip = type.facing !== 'symmetric' && type.facing !== requiredFacing;
            if (needsFlip) kaiju.querySelector('img').style.transform = 'scaleX(-1)';
            const effectiveType = needsFlip
                ? { ...type, origin: [1 - type.origin[0], type.origin[1]] }
                : type;

            const positionAndAnimate = (mapW, mapH) => {
                const vw = window.innerWidth, vh = window.innerHeight;
                const cr = canvas.getBoundingClientRect();
                // Standing on the ground - bottom-aligned to the board's bottom
                // edge - but sized and positioned so only about half their body
                // pokes past the board's edge, a small slice of the play area
                // rather than looming over the whole thing.
                let kH = Math.round(cr.height * 0.5);
                let kW = Math.round(kH * mapW / mapH);
                if (kW > vw * 0.4) { kW = Math.round(vw * 0.4); kH = Math.round(kW * mapH / mapW); }
                kaiju.style.width = kW + 'px';
                kaiju.style.height = kH + 'px';
                kaiju.style.filter = `drop-shadow(0 0 16px ${type.glow})`;
                let restX, restY, prop, startVal, endVal;
                restY = Math.max(0, Math.min(vh - kH, cr.bottom - kH));
                kaiju.style.top = restY + 'px';
                prop = 'left';
                if (type.entrance === 'left') {
                    // Half its width pokes past the board's left edge, the rest
                    // stays off-canvas.
                    restX = cr.left - kW * 0.5;
                    startVal = -kW; endVal = restX;
                } else {
                    restX = cr.right - kW * 0.5;
                    startVal = vw; endVal = restX;
                }
                kaiju.style[prop] = startVal + 'px';
                document.body.appendChild(kaiju);
                const a = {}; a[prop] = startVal + 'px';
                const b = {}; b[prop] = endVal + 'px';
                kaiju.animate([a, b], { duration: 1500, easing: 'ease-out', fill: 'forwards' }).onfinish = () => {
                    kaiju.style[prop] = endVal + 'px';
                    kaijuAttack(kaiju, effectiveType);
                    setTimeout(() => {
                        const oa = { opacity: 1 }; oa[prop] = endVal + 'px';
                        const ob = { opacity: 0 }; ob[prop] = startVal + 'px';
                        kaiju.animate([oa, ob], { duration: 1500, easing: 'ease-in', fill: 'forwards' }).onfinish = () => kaiju.remove();
                    }, 2700);
                };
            };

            const img = kaiju.querySelector('img');
            if (img.complete && img.naturalWidth) {
                positionAndAnimate(img.naturalWidth, img.naturalHeight); // cached, already loaded
            } else {
                img.addEventListener('load', () => positionAndAnimate(img.naturalWidth, img.naturalHeight), { once: true });
                // No procedural sprite to fall back to anymore - if the art fails to
                // load this spawn is simply skipped (createKaijuElement already logs why).
            }
        }

        function scheduleKaiju() {
            // Difficulty scaling: starts at the original 40-70s window, tightens to 15-40s by high levels.
            const minDelay = Math.max(15000, 40000 - level * 250);
            const maxDelay = Math.max(minDelay + 10000, 70000 - level * 300);
            const delay = Math.random() * (maxDelay - minDelay) + minDelay;
            setTimeout(() => { createKaiju(); scheduleKaiju(); }, delay);
        }

        // ====================================================================
        //  AUDIO STATE (the generated synthwave music engine that used to live
        //  here is gone - music now only plays if assets/audio/music/theme.mp3
        //  exists, see the custom-audio block below. midiFreq stays: sfxLevel/
        //  sfxGameOver still use it for their little stingers.)
        // ====================================================================
        let audioCtx = null, musicOn = false, fxOn = true;
        const midiFreq = m => 440 * Math.pow(2, (m - 69) / 12);

        // --- Native bridge helpers (Haptics / Game Center) ---
        // Guarded the same way as ContinuePurchase above: no-op outside the
        // Capacitor shell so kaiju-blocks.html (plain browser) still runs.
        function hapticImpact(style) {
            const plugin = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.Haptics;
            if (plugin) plugin.impact({ style }).catch(() => {});
        }
        function hapticNotification(type) {
            const plugin = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.Haptics;
            if (plugin) plugin.notification({ type }).catch(() => {});
        }
        function gameCenterSignIn() {
            const plugin = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.GameCenter;
            if (plugin) plugin.signIn().catch(e => console.warn('Game Center sign-in skipped:', e));
        }
        function gameCenterSubmitScore(finalScore) {
            const plugin = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.GameCenter;
            if (plugin) {
                plugin.submitScore({ leaderboardId: 'com.edgarj507.kaijublocks.highscores', score: finalScore })
                    .catch(e => console.warn('Game Center score submit failed:', e));
            }
        }

        // --- Custom audio overrides -----------------------------------------
        // Drop files into assets/audio/music/ or assets/audio/sfx/ (see the
        // README in each folder for exact filenames) to replace the built-in
        // generated audio below. Missing files fall back to generated sound
        // automatically - nothing else to wire up.
        // Plays as a looping playlist in this order; any file that's missing
        // is just skipped (see getLoadedMusicTracks) rather than breaking the
        // rotation, so any subset of these can be dropped in.
        const CUSTOM_MUSIC_PLAYLIST = [
            'assets/audio/music/kaiju-showdown.mp3',
            'assets/audio/music/neon-killswitch.mp3',
            'assets/audio/music/neon-killswitch-2.mp3',
            'assets/audio/music/neon-rush.mp3'
        ];
        const CUSTOM_SFX_PATHS = {
            move: 'assets/audio/sfx/move.mp3',
            rotate: 'assets/audio/sfx/rotate.mp3',
            lock: 'assets/audio/sfx/lock.mp3',
            harddrop: 'assets/audio/sfx/harddrop.mp3',
            blockBreak: 'assets/audio/sfx/block-break.mp3',
            lineClear: 'assets/audio/sfx/line-clear.mp3',
            levelUp: 'assets/audio/sfx/level-up.mp3',
            gameOver: 'assets/audio/sfx/game-over.mp3',
            kaijuRoar: 'assets/audio/sfx/kaiju-roar.mp3',
            beamFire: 'assets/audio/sfx/beam-fire.mp3',
            laserFire: 'assets/audio/sfx/laser-fire.mp3'
        };
        // Per-clip playback volume (0-1) for custom sfx that come in hotter than
        // the rest of the mix; anything not listed here just plays at full volume.
        const CUSTOM_SFX_VOLUME = {
            [CUSTOM_SFX_PATHS.blockBreak]: 0.6
        };
        const customAudioStatus = {}; // path -> 'ok' | 'failed'
        const customAudioElements = {}; // path -> HTMLAudioElement
        let currentMusicTrack = 0; // index into getLoadedMusicTracks(), advances as tracks end

        function probeCustomAudio(path) {
            if (customAudioStatus[path]) return;
            const el = new Audio();
            el.volume = CUSTOM_SFX_VOLUME[path] ?? 1;
            el.oncanplaythrough = () => { customAudioStatus[path] = 'ok'; };
            el.onerror = () => { customAudioStatus[path] = 'failed'; };
            el.src = path;
            customAudioElements[path] = el;
            customAudioStatus[path] = 'loading';
        }
        function preloadCustomAudio() {
            Object.values(CUSTOM_SFX_PATHS).forEach(probeCustomAudio);
            CUSTOM_MUSIC_PLAYLIST.forEach(probeCustomAudio);
        }
        // Checked lazily (not at preload time) since probes are still async
        // when preloadCustomAudio() returns.
        function getLoadedMusicTracks() {
            return CUSTOM_MUSIC_PLAYLIST.filter(p => customAudioStatus[p] === 'ok');
        }
        function playMusicTrack(index) {
            const tracks = getLoadedMusicTracks();
            if (tracks.length === 0) return;
            currentMusicTrack = ((index % tracks.length) + tracks.length) % tracks.length;
            const el = customAudioElements[tracks[currentMusicTrack]];
            el.currentTime = 0;
            el.onended = () => { if (musicOn) playMusicTrack(currentMusicTrack + 1); };
            el.play().catch(() => {});
        }
        // Plays the custom clip if it loaded successfully; returns whether it did,
        // so the caller knows whether to skip its generated fallback. When FX is
        // muted this returns true without playing anything, so every sfxXxx()
        // wrapper (they all check this first) skips its fallback too - one place
        // silences both custom and generated sound effects.
        function playCustomSfx(path) {
            if (!fxOn) return true;
            if (customAudioStatus[path] !== 'ok') return false;
            const el = customAudioElements[path];
            try { el.currentTime = 0; el.play().catch(() => {}); } catch (e) {}
            return true;
        }

        let sfxGain = null;
        function ensureAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                sfxGain = audioCtx.createGain();
                sfxGain.gain.value = 0.5;
                sfxGain.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }
        // Only plays if at least one CUSTOM_MUSIC_PLAYLIST file exists (no
        // generated music anymore) - still flips the toggle/button state
        // either way so it's not stuck showing OFF, it's just silent without
        // any files. Resumes on whichever track was playing (or next queued)
        // rather than always restarting the playlist from track 1.
        function startMusic() {
            ensureAudio();
            musicOn = true;
            musicToggle.textContent = '♪ MUSIC: ON';
            musicToggle.classList.add('on');
            playMusicTrack(currentMusicTrack);
        }
        function stopMusic() {
            getLoadedMusicTracks().forEach(p => {
                const el = customAudioElements[p];
                el.onended = null;
                el.pause();
            });
            musicOn = false;
            musicToggle.textContent = '♪ MUSIC: OFF';
            musicToggle.classList.remove('on');
            if (audioCtx) audioCtx.suspend();
        }
        // --- Sound effects (share the audio context, independent of music) ---
        function sBlip(freq, dur, type, peak, slideTo) {
            if (!audioCtx || !sfxGain) return;
            const now = audioCtx.currentTime;
            const o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.type = type || 'square';
            o.frequency.setValueAtTime(freq, now);
            if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, now + dur);
            o.connect(g); g.connect(sfxGain);
            g.gain.setValueAtTime(peak || 0.2, now);
            g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
            o.start(now); o.stop(now + dur + 0.02);
        }
        function sNoise(dur, peak, freq) {
            if (!audioCtx || !sfxGain) return;
            const now = audioCtx.currentTime;
            const len = Math.max(1, Math.floor(audioCtx.sampleRate * dur));
            const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
            const d = buf.getChannelData(0);
            for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
            const s = audioCtx.createBufferSource(); s.buffer = buf;
            const f = audioCtx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq || 800; f.Q.value = 0.6;
            const g = audioCtx.createGain();
            s.connect(f); f.connect(g); g.connect(sfxGain);
            g.gain.setValueAtTime(peak || 0.2, now);
            g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
            s.start(now); s.stop(now + dur);
        }
        function sfxMove() { if (playCustomSfx(CUSTOM_SFX_PATHS.move)) return; sBlip(200, 0.04, 'square', 0.08); }
        function sfxRotate() { if (playCustomSfx(CUSTOM_SFX_PATHS.rotate)) return; sBlip(340, 0.05, 'square', 0.10); }
        function sfxLock() { if (playCustomSfx(CUSTOM_SFX_PATHS.lock)) return; sBlip(150, 0.06, 'triangle', 0.14, 90); }
        function sfxDrop() {
            if (playCustomSfx(CUSTOM_SFX_PATHS.harddrop)) return;
            sBlip(520, 0.14, 'sawtooth', 0.10, 70); sNoise(0.12, 0.08, 500);
        }
        function sfxZap() { if (playCustomSfx(CUSTOM_SFX_PATHS.blockBreak)) return; sBlip(1000, 0.07, 'square', 0.12, 200); }
        function sfxLine(n) {
            if (playCustomSfx(CUSTOM_SFX_PATHS.lineClear)) return;
            for (let i = 0; i <= Math.min(3, n); i++) setTimeout(() => sBlip(420 + i * 160 + n * 60, 0.12, 'square', 0.12), i * 55);
            if (n >= 4) sNoise(0.4, 0.16, 1200);
        }
        function sfxLevel() {
            if (playCustomSfx(CUSTOM_SFX_PATHS.levelUp)) return;
            [0, 4, 7, 12].forEach((s, i) => setTimeout(() => sBlip(midiFreq(69 + s), 0.14, 'square', 0.13), i * 70));
        }
        function sfxGameOver() {
            if (playCustomSfx(CUSTOM_SFX_PATHS.gameOver)) return;
            [0, -3, -6, -12].forEach((s, i) => setTimeout(() => sBlip(midiFreq(64 + s), 0.3, 'sawtooth', 0.16, midiFreq(60 + s)), i * 160));
        }
        function sfxRoar() {
            if (playCustomSfx(CUSTOM_SFX_PATHS.kaijuRoar)) return;
            sNoise(0.55, 0.3, 200); sBlip(90, 0.5, 'sawtooth', 0.22, 46);
        }
        function sfxBeamFire() { if (playCustomSfx(CUSTOM_SFX_PATHS.beamFire)) return; sBlip(700, 0.08, 'sawtooth', 0.10, 1400); }
        function sfxLaserFire() { if (playCustomSfx(CUSTOM_SFX_PATHS.laserFire)) return; sBlip(1400, 0.05, 'square', 0.08, 2200); }

        musicToggle.addEventListener('click', () => { musicOn ? stopMusic() : startMusic(); });
        fxToggle.addEventListener('click', () => {
            fxOn = !fxOn;
            fxToggle.textContent = fxOn ? '\u{1F50A} FX: ON' : '\u{1F507} FX: OFF';
            fxToggle.classList.toggle('on', fxOn);
        });
        // ==================== end music ===================================

        const controlsActions = {
            '.left': () => playerMove(-1), '.right': () => playerMove(1),
            '.down': () => playerDrop(), '.up': () => playerRotate(),
            '.drop': () => playerHardDrop(), '#pauseButton': togglePause,
            '#resumeButton': togglePause, '#restartButton': resetGame
        };
        for (const [selector, action] of Object.entries(controlsActions)) {
            document.querySelector(selector)?.addEventListener('click', () => {
                ensureAudio();
                if (isGameOver && selector !== '#restartButton') return;
                if (isPaused && !['#pauseButton', '#resumeButton'].includes(selector)) return;
                action();
            });
        }
        document.addEventListener('keydown', (event) => {
            ensureAudio();
            if (isGameOver) return;
            if (event.key === ' ' || event.key.toLowerCase() === 'p') {
                event.preventDefault();
                togglePause();
                return;
            }
            if (isPaused) return;
            const keyMap = {
                'arrowleft': () => playerMove(-1), 'a': () => playerMove(-1),
                'arrowright': () => playerMove(1), 'd': () => playerMove(1),
                'arrowdown': () => playerDrop(), 's': () => playerDrop(),
                'arrowup': () => playerRotate(), 'w': () => playerRotate(),
                'enter': () => playerHardDrop()
            };
            keyMap[event.key.toLowerCase()]?.();
        });
        document.addEventListener('visibilitychange', handleVisibilityChange);

        // --- Start Game & Timers ---
        document.body.style.background = DYNAMIC_BACKGROUNDS[0];
        resetGame();
        resizeGame();
        initCityscape();
        gameCenterSignIn();
        preloadBeamImages();
        preloadCustomAudio();

        window.addEventListener('resize', () => {
            resizeGame();
            if(!isPaused) draw();
        });

        setInterval(() => {
            backgroundChangeTimer--;
            if (backgroundChangeTimer <= 0) {
                cycleCity();
                backgroundChangeTimer = BACKGROUND_TIMER_DURATION;
            }
        }, 1000);

        setInterval(createFlyingSaucer, 45000);
        setTimeout(() => { createKaiju(); scheduleKaiju(); }, 12000);

    </script>
</body>
</html>
